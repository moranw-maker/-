function selectedRows(l){return l.rows.filter(s=>s.direction===direction||s.direction==='בודדת').flatMap(s=>{const key=rowEditKey(s,l.index),patch=signEdits[key];if(patch?.deleted)return [];const lo=patch?.lo??s.lo,hi=patch?.hi??s.hi;if(Math.min(hi,l.hi)<=Math.max(lo,l.lo))return [];return [{...s,lo,hi,clipLo:Math.max(lo,l.lo),clipHi:Math.min(hi,l.hi),overrideSpeed:patch?.speed,_editKey:key,_original:s}];});}

function getEvents(l){const events=[];for(const f of customFeatures){if(f.route!==routeId||f.rail!==direction||f.leg!==l.index||f.km<l.lo||f.km>l.hi)continue;if(f.kind==='mag1000'&&!$('showMag1000').checked||f.kind==='mag500'&&!$('showMag500').checked||f.kind==='note'&&!$('showCustomNotes').checked)continue;events.push({kind:'custom',km:f.km,row:f});}for(const p of l.points)if(N.get(p.id).kind!=='reference')events.push({kind:'station',km:p.km,node:p.id});for(const s of selectedRows(l)){if(speedNumber(s,l.index)===null)continue;const entry=l.a<l.b?s.lo:s.hi,inside=entry>=l.lo-1e-6&&entry<=l.hi+1e-6,anchor=inside?entry:Math.min(l.hi,Math.max(l.lo,entry));events.push({kind:'speed',km:anchor,row:s,entry,continuation:!inside});}for(const c of l.crossings)events.push({kind:'crossing',km:c.km,row:c});for(const m of l.markers||[]){if(m.rail&&m.rail!==direction)continue;if(m.kind==='checker')events.push({kind:'checker',km:m.km,row:m});else{const a=Math.max(l.lo,m.lo),b=Math.min(l.hi,m.hi);events.push({kind:'neutral',km:l.a<l.b?a:b,row:m});events.push({kind:'zoneEnd',km:l.a<l.b?b:a,row:m});}}events.sort((a,b)=>Math.abs(a.km-l.a)-Math.abs(b.km-l.a));return events;}

function renderJourney(){const route=r();eventIndex=[];const indexes=route.legs.map((_,i)=>i);if(reversed)indexes.reverse();const sections=[];let previousStation=null,previousEvent=null;
for(const li of indexes){let l=route.legs[li];if(reversed)l={...l,a:l.b,b:l.a,points:[...l.points].reverse()};const events=getEvents(l),groups=[];for(const e of events){e.leg=li;if(e.kind==='station'){if(previousStation===e.node){previousEvent.locations.push({km:e.km,leg:li});continue}previousStation=e.node;previousEvent=e;e.locations=[{km:e.km,leg:li}];}e.index=eventIndex.length;eventIndex.push(e);let group=groups.at(-1);if(!group||Math.abs(group.km-e.km)>1e-6){group={km:e.km,events:[]};groups.push(group)}group.events.push(e);}sections.push({li,groups});}

function editSpeedNote(idx){const s=eventIndex[idx].row,key=s._editKey,f=customFeatures.find(x=>x.kind==='speedNote'&&x.key===key);openModal('עריכת הערה',`<form id="speedNoteForm" class="km-form custom-form"><p class="sub">${esc(speedNumber(s,eventIndex[idx].leg))} קמ״ש · ${fmt(s.lo)}–${fmt(s.hi)}</p><label><textarea id="speedNoteText" aria-label="טקסט ההערה" placeholder="כתוב הערה כאן...">${esc(f?.note||'')}</textarea></label><label class="important-check"><input id="speedNoteImportant" type="checkbox" ${f?.important?'checked':''}> סמן כהערה חשובה (אדום בולט)</label><button class="primary" type="submit">שמור הערה</button></form>`,true);featureContext={key};}
document.addEventListener('submit',e=>{if(e.target.id!=='stationEditForm')return;e.preventDefault();const node=featureContext.stationNode;customFeatures=customFeatures.filter(f=>!(f.kind==='stationMeta'&&f.node===node));customFeatures.push({kind:'stationMeta',node,name:$('stationName').value.trim(),platforms:$('stationPlatforms').value.trim(),contact:$('stationContact').value.trim(),phone:$('stationPhone').value.trim(),note:$('stationNote').value.trim()});featureSave();refreshAfterEdit();});
document.addEventListener('submit',e=>{if(e.target.id==='neutralEditForm'){e.preventDefault();customFeatures=customFeatures.filter(f=>!(f.kind==='neutralMeta'&&f.key===featureContext.neutralKey));const name=$('neutralName').value.trim()||'N.Z',note=$('neutralNote').value.trim();if(name!=='N.Z'||note)customFeatures.push({kind:'neutralMeta',key:featureContext.neutralKey,name,note});featureSave();refreshAfterEdit();}if(e.target.id==='speedNoteForm'){e.preventDefault();customFeatures=customFeatures.filter(x=>!(x.kind==='speedNote'&&x.key===featureContext.key));const note=$('speedNoteText').value.trim();if(note)customFeatures.push({kind:'speedNote',key:featureContext.key,note,important:$('speedNoteImportant').checked});featureSave();refreshAfterEdit();}if(e.target.id==='featureForm'){e.preventDefault();const kmText=$('featureKm').value.trim().replace(',','.'),km=/^\d+(?:\.\d{1,3})?$/.test(kmText)?Number(kmText):NaN,l=r().legs[featureContext.li],kind=$('featureKind').value,speed=$('featureSpeed')?.value;if(!Number.isFinite(km)||km<l.lo||km>l.hi||(['speed','checker'].includes(kind)&&(!Number.isInteger(Number(speed))||Number(speed)<1||Number(speed)>400))){$('featureError').textContent='יש להזין קילומטר בטווח המסלול ומהירות תקינה.';return;}const id=featureContext.id||'f'+Date.now()+Math.random().toString(36).slice(2);customFeatures=customFeatures.filter(x=>x.id!==id);customFeatures.push({id,kind,km,route:routeId,rail:direction,leg:featureContext.li,speed:speed||'',note:$('featureNote').value.trim(),important:kind==='note'&&!!$('featureImportant')?.checked});featureSave();refreshAfterEdit();}});
['showMag1000','showMag500','showCustomNotes'].forEach(id=>$(id).addEventListener('change',()=>renderJourney()));
function showSegment(li,km,whole=false){const l=r().legs[li],pts=l.points.filter(p=>N.get(p.id).kind!=='reference').sort((a,b)=>a.km-b.km),lo=whole?l.lo:[...pts].reverse().find(p=>p.km<=km)?.km??l.lo,hi=whole?l.hi:pts.find(p=>p.km>=km)?.km??l.hi;openModal(segmentLabel(li),speedTable(l,lo,hi),false);}
function showKmSearch(){openModal('מהירות לפי ק״מ',`<form id="kmForm" class="km-form"><label>קטע במסלול<select id="kmLeg">${r().legs.map((l,i)=>`<option value="${i}">${esc(segmentLabel(i))} · ${fmt(l.lo)}–${fmt(l.hi)}</option>`).join('')}</select></label><label>מיקום בק״מ<input id="kmInput" required type="text" inputmode="decimal" placeholder="לדוגמה: 82.000"></label><button type="submit" class="primary">הצג מהירות — ${esc(direction)}</button></form><div id="kmResult" aria-live="polite"></div>`,false);}
$('kmSearch').onclick=showKmSearch;document.addEventListener('submit',e=>{if(e.target.id!=='kmForm')return;e.preventDefault();const l=r().legs[Number($('kmLeg').value)],text=$('kmInput').value.trim().replace(',','.');if(!/^\d+(?:\.\d{1,3})?$/.test(text)){$('kmResult').innerHTML='<p class="notice">הקלידו ק״מ כמספר עם עד שלוש ספרות אחרי הנקודה.</p>';return}const km=Number(text);if(km<l.lo||km>l.hi){$('kmResult').innerHTML='<p class="notice">המיקום נמצא מחוץ למקטע שנבחר.</p>';return}const ss=selectedRows(l).filter(s=>km>=s.clipLo-1e-7&&km<=s.clipHi+1e-7&&speedNumber(s,l.index)!==null);$('kmResult').innerHTML=`<h3 class="table-title">ק״מ ${fmt(km)} · ${esc(direction)}</h3>`+(ss.length?`<div class="table-wrap"><table><thead><tr><th>מק״מ</th><th>עד ק״מ</th><th>קמ״ש</th></tr></thead><tbody>${ss.map(s=>`<tr><td><bdi>${fmt(s.lo)}</bdi></td><td><bdi>${fmt(s.hi)}</bdi></td><td>${esc(speedNumber(s,l.index))}</td></tr>`).join('')}</tbody></table></div>`:'<p class="notice">אין מהירות להצגה במיקום שנבחר.</p>');});document.addEventListener('input',e=>{if(['kmInput','kmLeg'].includes(e.target.id)&&$('kmResult'))$('kmResult').innerHTML='';});document.addEventListener('change',e=>{if(e.target.id==='kmLeg'&&$('kmResult'))$('kmResult').innerHTML='';});
function editStorageKey(){return 'route-study-sign-edits-v1:'+(D.edition||'book-23-09-26-v1');}
function terminalVariant(s,li){if(!/בכניסה/.test(s.speed)||!/ביציאה/.test(s.speed))return 'both';const route=r(),first=route.legs[0].points[0],last=route.legs.at(-1).points.at(-1);let out=li===0&&first.km>=s.lo&&first.km<=s.hi;if(!(out||(li===route.legs.length-1&&last.km>=s.lo&&last.km<=s.hi)))return 'both';if(reversed)out=!out;return out?'out':'in';}
function rowEditKey(s,li){return JSON.stringify([s.route,s.direction,s.page,s.from,s.to,s.speed,terminalVariant(s,li)]);}
function toast(message){$('editToast').innerHTML=esc(message)+' <button id="toastExport">הורד קובץ מעודכן</button><button id="toastDismiss" aria-label="סגור הודעה">×</button>';$('editToast').hidden=false;$('toastExport').onclick=exportEdited;$('toastDismiss').onclick=()=>{$('editToast').hidden=true;};}
function persistEdits(){let saved=true;try{localStorage.setItem(editStorageKey(),JSON.stringify({schema:1,edits:signEdits}));}catch(_){saved=false;}toast(saved?'השינוי נשמר בדפדפן.':'השינוי בוצע. הורד קובץ לשמירתו.');}
function refreshAfterEdit(){const y=window.scrollY;closeModal();renderJourney();window.scrollTo(0,y);}
function editSpeed(idx){const e=eventIndex[idx],s=e.row;editContext={key:s._editKey,event:e,label:segmentLabel(e.leg),rail:s.direction};openModal('עריכת שלט מהירות',`<form id="speedEditForm" class="km-form"><label>מהירות בקמ״ש<input id="editSpeedValue" type="number" min="1" max="400" step="1" required value="${esc(speedNumber(s,e.leg))}"></label><div class="edit-range"><label>מק״מ<input id="editSpeedFrom" inputmode="decimal" required value="${fmt(s.lo)}"></label><label>עד ק״מ<input id="editSpeedTo" inputmode="decimal" required value="${fmt(s.hi)}"></label></div><p class="edit-scope">השינוי יעודכן גם בקווים האחרים שבהם מופיע אותו שלט במסילה זו.</p><div id="speedEditError" role="alert"></div><div class="sign-actions"><button type="submit" class="primary">שמור שינוי</button><button type="button" id="cancelSpeedEdit">ביטול</button></div></form>`,true);$('cancelSpeedEdit').onclick=closeModal;}
document.addEventListener('submit',e=>{if(e.target.id!=='speedEditForm')return;e.preventDefault();const speed=Number($('editSpeedValue').value),parse=id=>{const t=$(id).value.trim().replace(',','.');return /^\d+(?:\.\d{1,3})?$/.test(t)?Number(t):NaN;},lo=parse('editSpeedFrom'),hi=parse('editSpeedTo');if(!Number.isInteger(speed)||speed<1||speed>400||!Number.isFinite(lo)||!Number.isFinite(hi)||hi<=lo){$('speedEditError').textContent='יש להזין מהירות שלמה וטווח ק״מ תקין, מהקטן לגדול.';return}const l=r().legs[editContext.event.leg];if(hi<=l.lo||lo>=l.hi){$('speedEditError').textContent='טווח הק״מ חייב לחפוף לקטע שבו נמצא השלט.';return}signEdits[editContext.key]={speed,lo,hi,deleted:false,label:editContext.label,rail:editContext.rail};persistEdits();refreshAfterEdit();});
function deleteSpeed(idx){const e=eventIndex[idx],s=e.row;openModal('מחיקת שלט מהירות',`<p class="edit-scope">למחוק את שלט ${esc(speedNumber(s,e.leg))} קמ״ש, בק״מ ${fmt(s.lo)}–${fmt(s.hi)}? המחיקה תעודכן בכל הקווים שבהם מופיע אותו שלט במסילה זו.</p><div class="sign-actions"><button class="danger" id="confirmDeleteSpeed">מחק שלט</button><button id="cancelDeleteSpeed">ביטול</button></div>`,true);$('cancelDeleteSpeed').onclick=closeModal;$('confirmDeleteSpeed').onclick=()=>{signEdits[s._editKey]={...(signEdits[s._editKey]||{}),deleted:true,label:segmentLabel(e.leg),rail:s.direction,lo:s.lo,hi:s.hi,speed:Number(speedNumber(s,e.leg))};persistEdits();refreshAfterEdit();};}
function showEditedSigns(){const entries=Object.entries(signEdits);openModal('שלטים שנערכו',entries.length?entries.map(([key,v],i)=>`<div class="edited-sign-row"><strong>${esc(v.label)}</strong><span>${v.deleted?'נמחק':esc(v.speed)+' קמ״ש'} · ${fmt(v.lo)}–${fmt(v.hi)} · ${esc(v.rail)}</span><button data-restore-edit="${i}">החזר שלט מקורי</button></div>`).join(''):'<p class="sub">אין שינויים בשלטים.</p>',false);$('modalBody').querySelectorAll('[data-restore-edit]').forEach(btn=>btn.onclick=()=>{delete signEdits[entries[Number(btn.dataset.restoreEdit)][0]];persistEdits();refreshAfterEdit();});}
function exportEdited(){ensureData();const copy=document.documentElement.cloneNode(true),data={...D,edits:{...signEdits},customFeatures:customFeatures,edition:'snapshot-'+Date.now()+'-'+Math.random().toString(36).slice(2)};copy.querySelector('#data').textContent=JSON.stringify(data).replace(/<\//g,'<\\/');copy.querySelector('#homeView').hidden=false;copy.querySelector('#courseView').hidden=true;copy.querySelector('#modal').hidden=true;copy.querySelector('#loadNotice').hidden=true;copy.querySelector('#editToast').hidden=true;copy.querySelector('#editToast').innerHTML='';copy.querySelector('#journey').innerHTML='';copy.querySelector('#modalBody').innerHTML='';copy.querySelector('#stationSearch').value='';copy.querySelector('#stationResults').innerHTML='';copy.querySelector('#stationResults').hidden=true;copy.querySelector('#routeSearch').setAttribute('value','');copy.querySelector('#trainLookupStatus').hidden=true;copy.querySelector('#trainLookupStatus').innerHTML='';copy.querySelectorAll('.route-card').forEach(c=>c.hidden=false);copy.querySelector('body').classList.remove('modal-open');const blob=new Blob(['<!doctype html>\n'+copy.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='route-study-edited.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
$('exportFile').onclick=exportEdited;$('editedSigns').onclick=showEditedSigns;
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const v=b.dataset;if(v.clearSpeedNote!==undefined){const row=eventIndex[Number(v.clearSpeedNote)].row;customFeatures=customFeatures.filter(f=>!(f.kind==='speedNote'&&f.key===row._editKey));featureSave();refreshAfterEdit();}else if(v.clearNeutral!==undefined){const ev=eventIndex[Number(v.clearNeutral)],key=neutralKey(ev),f=neutralMeta(ev);customFeatures=customFeatures.filter(x=>!(x.kind==='neutralMeta'&&x.key===key));if(f?.name&&f.name!=='N.Z')customFeatures.push({kind:'neutralMeta',key,name:f.name,note:''});featureSave();refreshAfterEdit();}else if(v.editStation!==undefined)editStation(Number(v.editStation));else if(v.speedNote!==undefined)editSpeedNote(Number(v.speedNote));else if(v.editNeutral!==undefined)editNeutral(Number(v.editNeutral));else if(v.customIndex!==undefined){const f=eventIndex[Number(v.customIndex)];featureForm(f.row.kind,f.leg,f.row.km,f.row.id);}else if(v.chooseFeature!==undefined){const {li,km}=featureContext;featureForm(v.chooseFeature,li,km);}else if(v.trackMarker!==undefined)showTrackMarker(Number(v.trackMarker));else if(v.editSpeed!==undefined)editSpeed(Number(v.editSpeed));else if(v.deleteSpeed!==undefined)deleteSpeed(Number(v.deleteSpeed));else if(v.jump!==undefined)jumpTo(Number(v.jump));else if(v.route!==undefined&& !b.classList.contains('route-card'))openRoute(Number(v.route));else if(v.station!==undefined)showStation(Number(v.station));else if(v.crossing!==undefined)showCrossing(Number(v.crossing));else if(v.speed!==undefined)showSpeed(Number(v.speed));else if(v.segment!==undefined)chooseFeature(Number(v.segment),Number(v.km));else if(v.wholeLeg!==undefined)showSegment(Number(v.wholeLeg),0,true);});
</script>
